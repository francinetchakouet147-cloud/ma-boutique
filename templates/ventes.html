<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ventes</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
<style>:root{--primary:#1e293b;--accent:#f59e0b;--bg:#f8fafc}body{background:var(--bg)}
.sidebar{width:260px;background:var(--primary);position:fixed;height:100vh;padding:22px;top:0;left:0;color:#cbd5e1;z-index:1000;transition:0.3s}
.sidebar a{color:#94a3b8;text-decoration:none;display:block;padding:12px 14px;border-radius:12px;margin-bottom:8px}.sidebar a.active,.sidebar a:hover{background:#334155;color:#fff}
.main{margin-left:260px;padding:20px 28px}.card{border:0;border-radius:18px;box-shadow:0 4px 20px rgba(0,0,0,.06)}.btn-vendre{background:var(--primary);color:#fff;border-radius:50px;font-weight:700;padding:8px 12px;border:0}
.hamburger{position:fixed;top:15px;left:15px;z-index:1100;background:var(--primary);color:white;border:0;border-radius:12px;padding:10px 14px;display:none}.overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:999}
@media(max-width:768px){.sidebar{transform:translateX(-100%)}.sidebar.open{transform:translateX(0)}.main{margin-left:0;padding-top:70px}.hamburger{display:block}.overlay.open{display:block}}
</style></head><body>
<button class="hamburger" onclick="toggleMenu()"><i class="bi bi-list fs-4"></i></button><div class="overlay" id="overlay" onclick="toggleMenu()"></div>
<div class="sidebar" id="sidebar"><h5 class="text-white fw-bold" id="bName">Boutique</h5><small style="color:var(--accent)">ATLAS • Ventes</small><hr style="border-color:#334155">
<a href="/boutique"><i class="bi bi-grid-fill me-2"></i>Boutique</a><a href="/ventes" class="active" style="background:var(--accent);color:#000;font-weight:700"><i class="bi bi-cart-check-fill me-2"></i>Ventes</a><a href="/commande"><i class="bi bi-receipt me-2"></i>Commande</a><a href="/dettes"><i class="bi bi-person-lines-fill me-2"></i>Dettes</a><a href="/enregistrer"><i class="bi bi-plus-circle me-2"></i>Enregistrer</a><a href="/historique"><i class="bi bi-clock-history me-2"></i>Historique</a><a href="/stock-faible"><i class="bi bi-exclamation-triangle me-2"></i>Stock faible</a><div style="margin-top:20px"><a href="/" style="background:#0f172a;color:#fff;padding:12px;border-radius:12px;display:block;text-align:center">Déconnexion</a></div></div>
<div class="main"><h5 class="fw-bold">Ventes - Cash ou Crédit</h5><div class="row g-3 mt-2" id="prodList"></div>
<div class="card p-4 mt-4"><div class="d-flex justify-content-between flex-wrap gap-2 mb-3"><div><small class="text-muted fw-bold">RECETTE AUJOURD'HUI</small><h3 class="fw-bold" id="recJour">0 FCFA</h3><small id="detailJour" class="text-muted">0 ventes</small></div></div><div class="table-responsive"><table class="table table-sm mt-2"><thead><tr><th>Produit</th><th>Qte</th><th>Recette</th><th>Bénéf</th></tr></thead><tbody id="detailTable"></tbody></table></div></div></div>

<div class="modal fade" id="creditModal"><div class="modal-dialog"><div class="modal-content rounded-4"><div class="modal-body p-4"><h6 class="fw-bold">💳 Vente à crédit</h6><p id="creditProd" class="small text-muted"></p><input id="cNom" class="form-control rounded-pill mt-2" placeholder="Nom client *"><input id="cTel" class="form-control rounded-pill mt-2" placeholder="Tel WhatsApp *"><input id="cAvance" type="number" class="form-control rounded-pill mt-2" placeholder="Avance payée (0 si rien)"><input id="cEcheance" type="date" class="form-control rounded-pill mt-2"><button class="btn btn-dark w-100 rounded-pill mt-3" onclick="saveCredit()">Créer dette + Enlever stock</button></div></div></div></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
function toggleMenu(){document.getElementById('sidebar').classList.toggle('open');document.getElementById('overlay').classList.toggle('open');}
let boutique=localStorage.getItem('boutique')||'Boutique Bibi Shop';document.getElementById('bName').innerText=boutique;let stock=[];let creditTmp=null;
const EMBALLAGES=[{nom:'Bouteille / Pièce',facteur:1},{nom:'Casier 6',facteur:6},{nom:'Casier 12',facteur:12},{nom:'Casier 14',facteur:14},{nom:'Casier 15',facteur:15},{nom:'Casier 20',facteur:20},{nom:'Casier 24',facteur:24},{nom:'Casier 25',facteur:25},{nom:'Palette 40',facteur:40},{nom:'Palette 72',facteur:72},{nom:'Carton 100',facteur:100}];
function sb(p){return p.stock_base??p.qte??0} function vb(p){return p.vente_base??p.vente??0} function ub(p){return p.unite_base??p.unite??'btl'}
async function load(){let r=await fetch('/api/stock?boutique='+encodeURIComponent(boutique));let j=await r.json();stock=j.stock.map(p=>{p.emballages=p.emballages||EMBALLAGES;return p});let html='';stock.forEach(p=>{let col=sb(p)<=5?'#ef4444':sb(p)<=10?'#f59e0b':'#10b981';let opts=p.emballages.map(e=>`<option value="${e.facteur}" data-nom="${e.nom}">${e.nom}</option>`).join('');html+=`<div class="col-md-6 col-xl-4"><div class="card p-3 h-100" style="border-left:5px solid ${col}"><div class="d-flex justify-content-between"><b>${p.nom}</b><span class="badge bg-light text-dark" style="font-size:10px">${p.groupe}</span></div><small class="text-muted">${sb(p)} ${ub(p)} • ${vb(p).toLocaleString()} FCFA</small><div class="d-flex gap-1 mt-3"><select id="unit-${p._id}" class="form-select rounded-pill" style="font-size:12px;max-width:115px">${opts}</select><input type="number" id="qte-${p._id}" value="1" min="1" class="form-control rounded-pill" style="width:55px"><button class="btn-vendre flex-fill" onclick="vendre('${p._id}', false)">Cash</button><button class="btn rounded-pill fw-bold flex-fill" style="background:var(--accent);color:#000;font-size:12px" onclick="vendre('${p._id}', true)">Crédit</button></div></div></div>`});document.getElementById('prodList').innerHTML=html;loadRecette();}
async function vendre(id, isCredit){
  let prod=stock.find(s=>s._id==id);let qCmd=parseFloat(document.getElementById('qte-'+id).value)||1;let sel=document.getElementById('unit-'+id);let facteur=parseFloat(sel.value)||1;let nomUnite=sel.options[sel.selectedIndex].dataset.nom;let qBase=qCmd*facteur;
  if(sb(prod)<qBase){alert(`Stock insuffisant! Reste ${sb(prod)} ${ub(prod)}, tu veux ${qBase}`);return;}
  if(!isCredit){
    await fetch('/api/mouvement',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,boutique,produit:prod.nom,type:'Vendu',qte:qBase,qte_affichee:`${qCmd} ${nomUnite}`,facteur,unite_cmd:nomUnite})}); load();
  }else{
    creditTmp={id, prod, qCmd, facteur, nomUnite, qBase, prix: vb(prod)*facteur};
    document.getElementById('creditProd').innerText=`${prod.nom} - ${qCmd} ${nomUnite} = ${qBase} btl - Total ${(creditTmp.prix*qCmd).toLocaleString()} FCFA`;
    new bootstrap.Modal(document.getElementById('creditModal')).show();
  }
}
async function saveCredit(){
  let nom=document.getElementById('cNom').value; let tel=document.getElementById('cTel').value; let avance=parseFloat(document.getElementById('cAvance').value)||0; let echeance=document.getElementById('cEcheance').value;
  if(!nom||!tel){alert('Nom + Tel obligatoires');return;}
  let total=creditTmp.prix*creditTmp.qCmd; let reste=total-avance;
  await fetch('/api/mouvement',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:creditTmp.id,boutique,produit:creditTmp.prod.nom,type:'Vendu',qte:creditTmp.qBase,qte_affichee:`${creditTmp.qCmd} ${creditTmp.nomUnite} (Crédit ${nom})`,facteur:creditTmp.facteur,unite_cmd:creditTmp.nomUnite})});
  await fetch('/api/dettes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({boutique,client:nom,tel,produits:[{nom:creditTmp.prod.nom,qte_cmd:creditTmp.qCmd,unite_cmd:creditTmp.nomUnite,qte_base:creditTmp.qBase,prix:creditTmp.prix}],total_dette:total,deja_paye:avance,reste,date_limite:echeance})});
  bootstrap.Modal.getInstance(document.getElementById('creditModal')).hide(); alert('✅ Dette créée'); load();
}
async function loadRecette(){let r=await fetch('/api/historique?boutique='+encodeURIComponent(boutique));let d=await r.json();let ventesJour=d.jour.filter(h=>h.type=='Vendu');let recette=ventesJour.reduce((a,b)=>a+b.vente*b.qte,0);let benef=ventesJour.reduce((a,b)=>a+(b.vente-b.achat)*b.qte,0);let nb=ventesJour.reduce((a,b)=>a+b.qte,0);document.getElementById('recJour').innerText=recette.toLocaleString()+' FCFA';document.getElementById('detailJour').innerText=`${nb} btl/pc vendus • Bénéf ${benef.toLocaleString()}`;let group={};ventesJour.forEach(v=>{if(!group[v.produit])group[v.produit]={qte:0,vente:v.vente,recette:0,benef:0};group[v.produit].qte+=v.qte;group[v.produit].recette+=v.qte*v.vente;group[v.produit].benef+=v.qte*(v.vente-v.achat);});let rows='';Object.entries(group).forEach(([nom,data])=>{rows+=`<tr><td><b>${nom}</b></td><td>${data.qte}</td><td>${data.recette.toLocaleString()}</td><td style="color:#10b981">+${data.benef.toLocaleString()}</td></tr>`});document.getElementById('detailTable').innerHTML=rows||'<tr><td colspan=4 class=text-center>Aucune vente</td></tr>';}
load();
</script></body></html>
