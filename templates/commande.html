<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Commande</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
<style>:root{--primary:#1e293b;--accent:#f59e0b;--bg:#f8fafc}body{background:var(--bg)}
.sidebar{width:260px;background:var(--primary);position:fixed;height:100vh;padding:22px;top:0;left:0;color:#cbd5e1;z-index:1000;transition:0.3s}
.sidebar a{color:#94a3b8;text-decoration:none;display:block;padding:12px 14px;border-radius:12px;margin-bottom:8px}.sidebar a.active,.sidebar a:hover{background:#334155;color:#fff}
.main{margin-left:260px;padding:20px 28px}.card{border:0;border-radius:18px;box-shadow:0 4px 20px rgba(0,0,0,.06)}
.hamburger{position:fixed;top:15px;left:15px;z-index:1100;background:var(--primary);color:white;border:0;border-radius:12px;padding:10px 14px;display:none}
.overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:999}
@media(max-width:768px){.sidebar{transform:translateX(-100%)}.sidebar.open{transform:translateX(0)}.main{margin-left:0;padding-top:70px}.hamburger{display:block}.overlay.open{display:block}}
</style></head><body>
<button class="hamburger" onclick="toggleMenu()"><i class="bi bi-list fs-4"></i></button><div class="overlay" id="overlay" onclick="toggleMenu()"></div>
<div class="sidebar" id="sidebar"><h5 class="text-white fw-bold" id="bNameSide">Boutique</h5><small style="color:var(--accent)">Atlas • Facturation</small><hr style="border-color:#334155">
<a href="/boutique"><i class="bi bi-grid-fill me-2"></i>Boutique</a><a href="/ventes"><i class="bi bi-cart-check-fill me-2"></i>Ventes rapide</a><a href="/commande" class="active" style="background:var(--accent);color:#000;font-weight:700"><i class="bi bi-receipt me-2"></i>Commande / Facture</a><a href="/enregistrer"><i class="bi bi-plus-circle me-2"></i>Enregistrer</a><a href="/historique"><i class="bi bi-clock-history me-2"></i>Historique</a><a href="/" style="background:#0f172a;color:#fff;padding:12px;border-radius:12px;display:block;text-align:center;margin-top:20px">Déconnexion</a></div>
<div class="main"><div class="row g-4">
<div class="col-lg-7"><h5 class="fw-bold"><i class="bi bi-basket me-2"></i>Choisir les produits</h5><input id="search" class="form-control rounded-pill mt-2 mb-3" placeholder="Rechercher..."><div class="row g-3" id="prodList"></div></div>
<div class="col-lg-5"><div class="card p-4" style="position:sticky;top:20px"><h6 class="fw-bold">🧾 Panier commande</h6>
<div class="mt-3"><label class="small text-muted">Nom du client *</label><input id="clientNom" class="form-control rounded-pill" placeholder="Mama Rose"><label class="small text-muted mt-2">Numéro WhatsApp *</label><input id="clientWa" class="form-control rounded-pill" placeholder="691234567"></div><hr><div id="cartList"><small class="text-muted">Aucun produit ajouté</small></div><hr><div class="d-flex justify-content-between"><span>Total</span><b id="total">0 FCFA</b></div>
<div class="d-grid gap-2 mt-4">
<button class="btn rounded-pill fw-bold" style="background:var(--primary);color:#fff" onclick="genererFacture()"><i class="bi bi-file-earmark-text"></i> Générer Facture</button>
<button class="btn rounded-pill fw-bold" style="background:#25D366;color:#fff" onclick="envoyerWhatsApp()"><i class="bi bi-whatsapp"></i> Envoyer WhatsApp</button>
</div><small id="saveStatus" class="text-success fw-bold text-center mt-2" style="display:none">✅ Enregistré dans Atlas</small></div>
<div class="facture mt-4 p-4 bg-white rounded-4" id="factureApercu" style="display:none;border:1px dashed #cbd5e1"><div class="d-flex justify-content-between"><div><h5 class="fw-bold mb-0" id="fBoutique">BIBI SHOP</h5><small class="text-muted" id="fDate"></small><br><small>Facture N° <b id="fNum"></b></small></div><div class="text-end"><h6 class="fw-bold">FACTURE</h6><small id="fClient"></small><br><small id="fClientTel"></small></div></div><hr><table class="table table-sm mt-2"><thead><tr><th>Produit</th><th>Qte</th><th>P.U</th><th>Total</th></tr></thead><tbody id="fTable"></tbody></table><div class="text-end mt-3"><h5 class="fw-bold" id="fTotal">Total: 0 FCFA</h5></div></div>
</div></div></div>
<script>
function toggleMenu(){document.getElementById('sidebar').classList.toggle('open');document.getElementById('overlay').classList.toggle('open');}
let boutique=localStorage.getItem('boutique')||'Boutique Bibi Shop';document.getElementById('bNameSide').innerText=boutique;
let stock=[]; let panier=[]; let dejaSave=false;
const EMBALLAGES=[{nom:'Bouteille / Pièce',facteur:1},{nom:'Casier 6',facteur:6},{nom:'Casier 12',facteur:12},{nom:'Casier 14',facteur:14},{nom:'Casier 15',facteur:15},{nom:'Casier 20',facteur:20},{nom:'Casier 24',facteur:24},{nom:'Casier 25',facteur:25},{nom:'Palette 40',facteur:40},{nom:'Palette 72',facteur:72},{nom:'Carton 100',facteur:100}];
function sb(p){return p.stock_base??p.qte??0} function vb(p){return p.vente_base??p.vente??0} function ub(p){return p.unite_base??p.unite??'btl'}
async function loadProd(){let r=await fetch('/api/stock?boutique='+encodeURIComponent(boutique));let j=await r.json();stock=j.stock.map(p=>{p.emballages=p.emballages||EMBALLAGES;return p});render(stock);}
function render(list){let html='';list.forEach(p=>{let opts=p.emballages.map(e=>`<option value="${e.facteur}" data-nom="${e.nom}">${e.nom} (x${e.facteur})</option>`).join('');html+=`<div class="col-md-6"><div class="card p-3"><div class="d-flex justify-content-between"><b>${p.nom}</b><span class="badge bg-light text-dark">${p.groupe}</span></div><small class="text-success fw-bold">${sb(p)} ${ub(p)} • ${vb(p).toLocaleString()} FCFA</small><div class="d-flex gap-1 mt-2"><select id="unit-${p._id}" class="form-select form-select-sm" style="max-width:125px">${opts}</select><input type="number" id="inp-${p._id}" value="1" min="1" class="form-control form-control-sm" style="width:55px"><button class="btn btn-sm rounded-pill flex-fill" style="background:var(--accent)" onclick="ajouter('${p._id}')">+</button></div></div></div>`});document.getElementById('prodList').innerHTML=html;}
document.getElementById('search').addEventListener('input',e=>{let v=e.target.value.toLowerCase();render(stock.filter(s=>s.nom.toLowerCase().includes(v)||s.groupe.toLowerCase().includes(v)));});
function ajouter(id){let p=stock.find(s=>s._id==id);let qCmd=parseFloat(document.getElementById('inp-'+id).value)||1;let sel=document.getElementById('unit-'+id);let facteur=parseFloat(sel.value)||1;let nomUnite=sel.options[sel.selectedIndex].dataset.nom;let qBase=qCmd*facteur;if(sb(p)<qBase){alert(`Stock insuffisant. Reste ${sb(p)} ${ub(p)}, tu demandes ${qBase}`);return;}let prixCmd=vb(p)*facteur;let ex=panier.find(x=>x._id==id && x.facteur==facteur);if(ex){ex.qte_cmd+=qCmd; ex.qte_base+=qBase;}else{panier.push({_id:id,nom:p.nom,unite_base:ub(p),qte_cmd:qCmd,unite_cmd:nomUnite,facteur:facteur,qte_base:qBase,prix_base:vb(p),prix_cmd:prixCmd});}dejaSave=false;updateCart();}
function updateCart(){if(panier.length==0){document.getElementById('cartList').innerHTML='<small class="text-muted">Aucun produit</small>';document.getElementById('total').innerText='0 FCFA';return;}let html='';let total=0;panier.forEach((it,i)=>{let t=it.qte_cmd*it.prix_cmd;total+=t;html+=`<div class="d-flex justify-content-between mb-2"><div><b>${it.nom}</b><br><small>${it.qte_cmd} x ${it.unite_cmd} = ${it.qte_base} ${it.unite_base}</small></div><div><b>${t.toLocaleString()}</b> <button class="btn btn-sm btn-light rounded-circle" onclick="panier.splice(${i},1);dejaSave=false;updateCart()">x</button></div></div>`;});document.getElementById('cartList').innerHTML=html;document.getElementById('total').innerText=total.toLocaleString()+' FCFA';}
async function saveCachette(){ if(dejaSave || panier.length==0) return; let nom=document.getElementById('clientNom').value||'Client'; for(let it of panier){ await fetch('/api/mouvement',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:it._id,boutique,produit:it.nom,type:'Vendu',qte:it.qte_base,qte_affichee:`${it.qte_cmd} ${it.unite_cmd}`,facteur:it.facteur,unite_cmd:it.unite_cmd})}); } let total=panier.reduce((a,b)=>a+b.qte_cmd*b.prix_cmd,0); await fetch('/api/factures',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({boutique,num:'FAC-'+Date.now().toString().slice(-6),client:nom,tel:document.getElementById('clientWa').value,total,produits:panier})}); dejaSave=true; document.getElementById('saveStatus').style.display='block'; loadProd();}
function genererFacture(){ if(panier.length==0){alert('Panier vide');return;} let nom=document.getElementById('clientNom').value||'Client'; let tel=document.getElementById('clientWa').value||''; let now=new Date(); let dateStr=now.toLocaleDateString('fr-FR')+' '+now.toLocaleTimeString('fr-FR'); let num='FAC-'+Date.now().toString().slice(-6); document.getElementById('fBoutique').innerText=boutique.toUpperCase(); document.getElementById('fDate').innerText=dateStr; document.getElementById('fNum').innerText=num; document.getElementById('fClient').innerText=nom; document.getElementById('fClientTel').innerText=tel; let rows=''; let total=0; panier.forEach(it=>{let t=it.qte_cmd*it.prix_cmd;total+=t;rows+=`<tr><td>${it.nom}<br><small class="text-muted">${it.unite_cmd}</small></td><td>${it.qte_cmd}</td><td>${it.prix_cmd.toLocaleString()}</td><td>${t.toLocaleString()}</td></tr>`;}); document.getElementById('fTable').innerHTML=rows; document.getElementById('fTotal').innerText='Total: '+total.toLocaleString()+' FCFA'; document.getElementById('factureApercu').style.display='block'; saveCachette();}
function envoyerWhatsApp(){ if(panier.length==0){alert('Panier vide');return;} let nom=document.getElementById('clientNom').value; let wa=document.getElementById('clientWa').value; if(!nom||!wa){alert('Mets nom + WhatsApp');return;} let num=wa.replace(/[^0-9]/g,''); if(num.length==9) num='237'+num; let now=new Date(); let dateStr=now.toLocaleDateString('fr-FR'); let total=panier.reduce((a,b)=>a+b.qte_cmd*b.prix_cmd,0); let msg=`*${boutique.toUpperCase()} - FACTURE*%0A📅 ${dateStr}%0A👤 Client: ${nom}%0A----------------------------%0A`; panier.forEach(it=>{msg+=`• ${it.nom} - ${it.qte_cmd} ${it.unite_cmd} = ${(it.qte_cmd*it.prix_cmd).toLocaleString()} FCFA%0A`;}); msg+=`----------------------------%0A*TOTAL: ${total.toLocaleString()} FCFA*`; window.open(`https://wa.me/${num}?text=${msg}`,'_blank'); saveCachette(); genererFacture();}
loadProd();
</script></body></html>
