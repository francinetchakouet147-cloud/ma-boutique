<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Commande</title>
<link rel="manifest" href="/static/manifest.json">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
<style>:root{--primary:#1e293b;--accent:#f59e0b;--bg:#f8fafc}body{background:var(--bg)}.sidebar{width:260px;background:var(--primary);position:fixed;height:100vh;padding:22px;top:0;left:0;color:#cbd5e1;z-index:10}.sidebar a{color:#94a3b8;text-decoration:none;display:block;padding:12px 14px;border-radius:12px;margin-bottom:8px}.sidebar a.active,.sidebar a:hover{background:#334155;color:#fff}.main{margin-left:260px;padding:20px 28px}.card{border:0;border-radius:18px;box-shadow:0 4px 20px rgba(0,0,0,.06)}.cart{position:sticky;top:20px}.facture{background:#fff;padding:28px;border-radius:16px;border:1px dashed #cbd5e1}</style></head><body>
<div class="sidebar"><h5 class="text-white fw-bold" id="bNameSide">Boutique</h5><small style="color:var(--accent)">Facturation WhatsApp</small><hr style="border-color:#334155">
<a href="/boutique"><i class="bi bi-grid-fill me-2"></i>Boutique</a><a href="/ventes"><i class="bi bi-cart-check-fill me-2"></i>Ventes rapide</a><a href="/commande" class="active" style="background:var(--accent);color:#000;font-weight:700"><i class="bi bi-receipt me-2"></i>Commande / Facture</a><a href="/enregistrer"><i class="bi bi-plus-circle me-2"></i>Enregistrer</a><a href="/historique"><i class="bi bi-clock-history me-2"></i>Historique</a></div>

<div class="main"><div class="row g-4">
<div class="col-lg-7"><h5 class="fw-bold"><i class="bi bi-basket me-2"></i>Choisir les produits</h5><input id="search" class="form-control rounded-pill mt-2 mb-3" placeholder="Rechercher..."><div class="row g-3" id="prodList"></div></div>
<div class="col-lg-5"><div class="card cart p-4"><h6 class="fw-bold">🧾 Panier commande</h6>
<div class="mt-3"><label class="small text-muted">Nom du client *</label><input id="clientNom" class="form-control rounded-pill" placeholder="Mama Rose"><label class="small text-muted mt-2">Numéro WhatsApp *</label><input id="clientWa" class="form-control rounded-pill" placeholder="691234567"></div><hr><div id="cartList"><small class="text-muted">Aucun produit ajouté</small></div><hr><div class="d-flex justify-content-between"><span>Total</span><b id="total">0 FCFA</b></div>
<div class="d-grid gap-2 mt-4">
<button class="btn rounded-pill fw-bold" style="background:var(--primary);color:#fff" onclick="genererFacture()"><i class="bi bi-file-earmark-text"></i> Générer Facture</button>
<button class="btn rounded-pill fw-bold" style="background:#25D366;color:#fff" onclick="envoyerWhatsApp()"><i class="bi bi-whatsapp"></i> Envoyer sur WhatsApp</button>
<button class="btn btn-light rounded-pill" onclick="window.print()">Imprimer</button>
</div><small id="saveStatus" class="text-success fw-bold text-center mt-2" style="display:none">✅ Enregistré dans Ventes en cachette</small></div>
<div class="facture mt-4" id="factureApercu" style="display:none"><div class="d-flex justify-content-between"><div><h5 class="fw-bold mb-0" id="fBoutique">BIBI SHOP</h5><small class="text-muted" id="fDate"></small><br><small>Facture N° <b id="fNum"></b></small></div><div class="text-end"><h6 class="fw-bold">FACTURE</h6><small id="fClient"></small><br><small id="fClientTel"></small></div></div><hr><table class="table table-sm mt-2"><thead><tr><th>Produit</th><th>Qte</th><th>P.U</th><th>Total</th></tr></thead><tbody id="fTable"></tbody></table><div class="text-end mt-3"><h5 class="fw-bold" id="fTotal">Total: 0 FCFA</h5><small>Merci pour votre confiance !</small></div></div>
</div></div></div>

<script>
let boutique=localStorage.getItem('boutique')||'Boutique Bibi Shop';document.getElementById('bNameSide').innerText=boutique;
let stock=[]; let panier=[]; let dejaSave=false;
async function loadProd(){let r=await fetch('/api/stock?boutique='+encodeURIComponent(boutique));let j=await r.json();stock=j.stock;render(stock);}
function render(list){let html='';list.forEach(p=>{html+=`<div class="col-md-6"><div class="card p-3"><div class="d-flex justify-content-between"><b>${p.nom}</b><span class="badge bg-light text-dark">${p.groupe}</span></div><small class="text-muted">${p.qte} ${p.unite} • ${p.vente} FCFA</small><div class="d-flex gap-2 mt-2"><input type="number" id="inp-${p.id}" value="1" min="1" max="${p.qte}" class="form-control form-control-sm" style="width:70px"><button class="btn btn-sm rounded-pill flex-fill" style="background:var(--accent)" onclick="ajouter(${p.id})">Ajouter +</button></div></div></div>`});document.getElementById('prodList').innerHTML=html;}
document.getElementById('search').addEventListener('input',e=>{let v=e.target.value.toLowerCase();render(stock.filter(s=>s.nom.toLowerCase().includes(v)||s.groupe.toLowerCase().includes(v)));});
function ajouter(id){let p=stock.find(s=>s.id==id);let q=parseFloat(document.getElementById('inp-'+id).value)||1;if(p.qte<q){alert('Stock insuffisant');return;}let ex=panier.find(x=>x.id==id);if(ex){ex.qte+=q}else{panier.push({id,nom:p.nom,vente:p.vente,achat:p.achat,qte:q,groupe:p.groupe});}dejaSave=false;updateCart();}
function updateCart(){if(panier.length==0){document.getElementById('cartList').innerHTML='<small class="text-muted">Aucun produit</small>';document.getElementById('total').innerText='0 FCFA';return;}let html='';let total=0;panier.forEach((it,i)=>{let t=it.qte*it.vente;total+=t;html+=`<div class="d-flex justify-content-between mb-2"><div><b>${it.nom}</b><br><small>${it.qte} x ${it.vente}</small></div><div><b>${t.toLocaleString()}</b> <button class="btn btn-sm btn-light rounded-circle" onclick="panier.splice(${i},1);dejaSave=false;updateCart()">x</button></div></div>`;});document.getElementById('cartList').innerHTML=html;document.getElementById('total').innerText=total.toLocaleString()+' FCFA';}

// FONCTION CACHETTE - enregistre dans vente sans le montrer au client
async function saveCachette(){
 if(dejaSave || panier.length==0) return;
 let nom=document.getElementById('clientNom').value||'Client';
 let tel=document.getElementById('clientWa').value||'';
 let now=new Date(); let num='FAC-'+Date.now().toString().slice(-6);
 let total=panier.reduce((a,b)=>a+b.qte*b.vente,0);
 // 1. Enregistre dans ventes (cachette)
 for(let it of panier){
   await fetch('/api/mouvement',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:it.id,boutique,produit:it.nom,type:'Vendu',qte:it.qte,client:nom})});
 }
 // 2. Garde la facture
 await fetch('/api/factures',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({boutique,num,client:nom,tel,total,produits:panier})});
 dejaSave=true; document.getElementById('saveStatus').style.display='block'; loadProd();
}

function genererFacture(){
 if(panier.length==0){alert('Panier vide');return;}
 let nom=document.getElementById('clientNom').value||'Client'; let tel=document.getElementById('clientWa').value||'';
 let now=new Date(); let dateStr=now.toLocaleDateString('fr-FR')+' '+now.toLocaleTimeString('fr-FR'); let num='FAC-'+Date.now().toString().slice(-6);
 document.getElementById('fBoutique').innerText=boutique.toUpperCase(); document.getElementById('fDate').innerText=dateStr; document.getElementById('fNum').innerText=num;
 document.getElementById('fClient').innerText=nom; document.getElementById('fClientTel').innerText=tel;
 let rows=''; let total=0; panier.forEach(it=>{let t=it.qte*it.vente;total+=t;rows+=`<tr><td>${it.nom}</td><td>${it.qte}</td><td>${it.vente.toLocaleString()}</td><td>${t.toLocaleString()}</td></tr>`;});
 document.getElementById('fTable').innerHTML=rows; document.getElementById('fTotal').innerText='Total: '+total.toLocaleString()+' FCFA';
 document.getElementById('factureApercu').style.display='block';
 saveCachette(); // <--- enregistre en cachette ici
}
function envoyerWhatsApp(){
 if(panier.length==0){alert('Panier vide');return;}
 let nom=document.getElementById('clientNom').value; let wa=document.getElementById('clientWa').value;
 if(!nom||!wa){alert('Mets nom + WhatsApp');return;}
 let num=wa.replace(/[^0-9]/g,''); if(num.length==9) num='237'+num;
 let now=new Date(); let dateStr=now.toLocaleDateString('fr-FR')+' '+now.toLocaleTimeString('fr-FR');
 let total=panier.reduce((a,b)=>a+b.qte*b.vente,0);
 let msg=`*${boutique.toUpperCase()} - FACTURE*%0A📅 ${dateStr}%0A👤 Client: ${nom}%0A----------------------------%0A`;
 panier.forEach(it=>{msg+=`• ${it.nom} (${it.qte} x ${it.vente.toLocaleString()}) = ${(it.qte*it.vente).toLocaleString()} FCFA%0A`;});
 msg+=`----------------------------%0A*TOTAL: ${total.toLocaleString()} FCFA*%0A%0AMerci 🙏%0A${boutique}`;
 window.open(`https://wa.me/${num}?text=${msg}`,'_blank');
 saveCachette(); // <--- enregistre en cachette aussi ici
 genererFacture();
}
loadProd();
</script></body></html>
