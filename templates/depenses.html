<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dépenses</title>
<link rel="manifest" href="/static/manifest.json">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
<style>:root{--primary:#1e293b;--accent:#f59e0b;--bg:#f8fafc}body{background:var(--bg)}.sidebar{width:260px;background:var(--primary);position:fixed;height:100vh;padding:22px;top:0;left:0;color:#cbd5e1}.sidebar a{color:#94a3b8;text-decoration:none;display:block;padding:12px 14px;border-radius:12px;margin-bottom:8px}.sidebar a.active,.sidebar a:hover{background:#334155;color:#fff}.main{margin-left:260px;padding:20px 28px}.card{border:0;border-radius:18px;box-shadow:0 4px 20px rgba(0,0,0,.06)}.kpi{border-left:4px solid var(--accent)}</style></head><body>
<div class="sidebar"><h5 class="text-white fw-bold" id="bName">Boutique</h5><hr style="border-color:#334155">
<a href="/boutique"><i class="bi bi-grid-fill me-2"></i>Boutique</a><a href="/ventes"><i class="bi bi-cart-check-fill me-2"></i>Ventes</a><a href="/commande"><i class="bi bi-receipt me-2"></i>Commande</a><a href="/factures"><i class="bi bi-file-earmark-text me-2"></i>Factures</a><a href="/depenses" class="active" style="background:var(--accent);color:#000;font-weight:700"><i class="bi bi-cash-stack me-2"></i>Dépenses</a><a href="/historique"><i class="bi bi-clock-history me-2"></i>Historique</a><a href="/statistiques"><i class="bi bi-graph-up me-2"></i>Stats</a></div>
<div class="main">
<div class="d-flex justify-content-between align-items-center"><h5 class="fw-bold">Dépenses - Bénéfice Net</h5><button class="btn btn-dark rounded-pill" data-bs-toggle="modal" data-bs-target="#addM"><i class="bi bi-plus"></i> Ajouter dépense</button></div>

<div class="row g-3 mt-1"><div class="col-md-4"><div class="card p-3 kpi"><small class="text-muted">AUJOURD'HUI</small><h5 id="tJour" class="fw-bold text-danger">0 FCFA</h5></div></div><div class="col-md-4"><div class="card p-3 kpi"><small class="text-muted">CETTE SEMAINE</small><h5 id="tSem" class="fw-bold text-danger">0 FCFA</h5></div></div><div class="col-md-4"><div class="card p-3 kpi"><small class="text-muted">CE MOIS</small><h5 id="tMois" class="fw-bold text-danger">0 FCFA</h5></div></div></div>

<ul class="nav nav-pills mt-4"><li class="nav-item"><button class="nav-link active rounded-pill" onclick="show('jour')">Jour</button></li><li class="nav-item"><button class="nav-link rounded-pill" onclick="show('semaine')">Semaine</button></li><li class="nav-item"><button class="nav-link rounded-pill" onclick="show('mois')">Mois</button></li></ul>
<div class="card p-3 mt-3"><div id="list"></div></div>
</div>

<div class="modal fade" id="addM"><div class="modal-dialog"><div class="modal-content rounded-4"><div class="modal-body p-4"><h6 class="fw-bold">Nouvelle dépense</h6><input id="motif" class="form-control rounded-pill mt-3" placeholder="Motif ex: Transport moto"><select id="cat" class="form-select rounded-pill mt-2"><option>Transport</option><option>Loyer</option><option>Achat marchandise</option><option>Crédit / Internet</option><option>Nourriture</option><option>Autre</option></select><input id="mont" type="number" class="form-control rounded-pill mt-2" placeholder="Montant FCFA"><button class="btn btn-dark w-100 rounded-pill mt-3" onclick="saveDep()">Enregistrer</button></div></div></div></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
let boutique=localStorage.getItem('boutique')||'Boutique Bibi Shop';document.getElementById('bName').innerText=boutique;let data={};let cur='jour';
async function load(){let r=await fetch('/api/depenses?boutique='+encodeURIComponent(boutique));data=await r.json();document.getElementById('tJour').innerText=data.total_jour.toLocaleString()+' FCFA';document.getElementById('tSem').innerText=data.total_semaine.toLocaleString()+' FCFA';document.getElementById('tMois').innerText=data.total_mois.toLocaleString()+' FCFA';show(cur);}
function show(k){cur=k;document.querySelectorAll('.nav-link').forEach(b=>b.classList.remove('active'));event?.target?.classList.add('active');let list=data[k]||[];let h='';if(list.length==0)h='<small class=text-muted>Aucune dépense</small>';list.forEach(d=>{h+=`<div class="d-flex justify-content-between align-items-center border-bottom py-2"><div><b>${d.motif}</b><br><small class="text-muted">${d.categorie} • ${d.date} ${d.heure}</small></div><div class="d-flex gap-2 align-items-center"><b class="text-danger">-${d.montant.toLocaleString()} FCFA</b><button class="btn btn-sm btn-light rounded-circle" onclick="delDep(${d.id})">x</button></div></div>`});document.getElementById('list').innerHTML=h;}
async function saveDep(){let m=document.getElementById('motif').value;let ca=document.getElementById('cat').value;let mo=parseFloat(document.getElementById('mont').value);if(!m||!mo){alert('Remplis tout');return;}await fetch('/api/depenses',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({boutique,motif:m,categorie:ca,montant:mo})});bootstrap.Modal.getInstance(document.getElementById('addM')).hide();load();}
async function delDep(id){if(!confirm('Supprimer?'))return;await fetch('/api/depenses/'+id,{method:'DELETE'});load();}
load();
</script></body></html>
