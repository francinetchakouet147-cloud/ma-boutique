<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><title>Admin Aurélie</title>
<link rel="manifest" href="/static/manifest.json">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
</head><body style="background:#f5f7fb">
<div style="width:260px;background:#0d6efd;position:fixed;height:100vh;color:white;padding:20px">
<h5>Boutique Aurélie</h5><p>SQLite - stock.db</p><hr><button class="btn btn-light w-100" onclick="location.href='/'">Déconnexion</button></div>
<div style="margin-left:260px;padding:25px">
<h3>Tous mes clients (<span id="count">0</span>) <button class="btn btn-primary float-end" data-bs-toggle="modal" data-bs-target="#modalAdd">+ Nouveau client</button></h3>
<div class="card p-3 mt-3"><table class="table table-bordered"><thead><tr><th>Nom</th><th>Tél</th><th>Boutique</th><th>Pass</th><th>Statut</th><th>Actions</th></tr></thead><tbody id="tbody"></tbody></table></div>
</div>

<div class="modal fade" id="modalAdd"><div class="modal-dialog"><div class="modal-content"><div class="modal-header"><h5 id="modalTitle">Nouveau client</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
<div class="modal-body">
<input type="hidden" id="edit_id">
<input id="c_nom" class="form-control mb-2" placeholder="nom login">
<input id="c_tel" class="form-control mb-2" placeholder="tel">
<input id="c_boutique" class="form-control mb-2" placeholder="Boutique">
</div><div class="modal-footer"><button class="btn btn-primary w-100" onclick="saveClient()">Enregistrer dans stock.db</button></div></div></div></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
async function load(){let r=await fetch('/api/clients');let cs=await r.json();document.getElementById('count').innerText=cs.length;let tbody=document.getElementById('tbody');tbody.innerHTML='';cs.forEach(c=>{
tbody.innerHTML+=`<tr><td>${c.nom}</td><td>${c.tel}</td><td>${c.boutique}</td><td><span class="badge ${c.premiere?'bg-warning text-dark':'bg-dark'}">${c.pass}</span> <a href="#" onclick="resetPass(${c.id})">↻</a></td><td><span class="badge ${c.bloque?'bg-danger':'bg-success'}">${c.bloque?'Bloqué':'Actif'}</span></td><td>
<button class="btn btn-sm btn-info text-white" onclick="editClient(${c.id},'${c.nom}','${c.tel}','${c.boutique}')"><i class="bi bi-pencil"></i> Modifier</button>
<button class="btn btn-sm ${c.bloque?'btn-success':'btn-warning'}" onclick="toggleBlock(${c.id},${c.bloque})">${c.bloque?'Débloquer':'Bloquer'}</button>
<button class="btn btn-sm btn-danger" onclick="suppr(${c.id})">X</button></td></tr>`});}

function editClient(id,nom,tel,boutique){
 document.getElementById('edit_id').value=id;
 document.getElementById('c_nom').value=nom;
 document.getElementById('c_tel').value=tel;
 document.getElementById('c_boutique').value=boutique;
 document.getElementById('modalTitle').innerText='Modifier '+nom;
 new bootstrap.Modal(document.getElementById('modalAdd')).show();
}
async function saveClient(){
 let id=document.getElementById('edit_id').value;
 let nom=document.getElementById('c_nom').value.toLowerCase().trim();
 let tel=document.getElementById('c_tel').value.trim();
 let boutique=document.getElementById('c_boutique').value.trim();
 if(!nom||!tel||!boutique) return alert('Remplis tout');
 if(id){
   await fetch(`/api/clients/${id}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({nom,tel,boutique})});
 } else {
   await fetch('/api/clients',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nom,tel,boutique})});
 }
 document.getElementById('edit_id').value=''; document.getElementById('c_nom').value=''; document.getElementById('c_tel').value=''; document.getElementById('c_boutique').value='';
 bootstrap.Modal.getInstance(document.getElementById('modalAdd')).hide();
 load();
}
async function toggleBlock(id,b){await fetch(`/api/clients/${id}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({bloque:!b})});load();}
async function suppr(id){if(!confirm('Supprimer?'))return;await fetch(`/api/clients/${id}`,{method:'DELETE'});load();}
async function resetPass(id){await fetch(`/api/clients/${id}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({reset:true})});load();}
load();
</script></body></html>
