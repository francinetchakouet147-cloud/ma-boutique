<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Boutique</title>
<link rel="manifest" href="/static/manifest.json">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>:root{--primary:#1e293b;--accent:#f59e0b;--bg:#f8fafc}body{background:var(--bg)}.sidebar{width:260px;background:var(--primary);position:fixed;height:100vh;padding:22px;color:#cbd5e1;top:0;left:0}.sidebar a{color:#94a3b8;text-decoration:none;display:block;padding:12px 14px;border-radius:12px;margin-bottom:8px}.sidebar a.active,.sidebar a:hover{background:#334155;color:#fff}.main{margin-left:260px;padding:28px}.card{border:0;border-radius:20px;box-shadow:0 8px 30px rgba(0,0,0,.06)}.btn-gold{background:var(--accent);border:0;color:#000;font-weight:700;border-radius:50px}</style></head><body>
<div class="sidebar">
  <div>
    <h5 class="text-white fw-bold" id="bName">Boutique</h5><small style="color:var(--accent)">STOCK.DB • Chic Luxe</small>
    <hr style="border-color:#334155">
  </div>
  
  <div class="menu">
    <a href="/boutique" class="active"><i class="bi bi-grid-fill me-2"></i>Boutique</a>
    <a href="/historique"><i class="bi bi-clock-history me-2"></i>Historique</a>
    <a href="/ventes"><i class="bi bi-cart-check-fill me-2"></i>Ventes rapide</a>
    <a href="/commande"><i class="bi bi-receipt me-2"></i>Commande / Facture</a>
    <a href="/factures"><i class="bi bi-file-earmark-text me-2"></i>Factures</a>
    <a href="/depenses"><i class="bi bi-cash-stack me-2"></i>Dépenses</a>
    <a href="/enregistrer"><i class="bi bi-plus-circle me-2"></i>Enregistrer</a>
    <a href="/categories"><i class="bi bi-tags me-2"></i>Catégories</a>
    <a href="/statistiques"><i class="bi bi-graph-up me-2"></i>Statistiques</a>
    <a href="/stock-faible"><i class="bi bi-exclamation-triangle me-2"></i>Stock faible</a>
  </div>

  <div class="sidebar-bottom">
    <a href="/" style="background:#0f172a;color:#fff;padding:12px;border-radius:12px;display:block;text-align:center;text-decoration:none;justify-content:center">Déconnexion</a>
  </div>
</div>
<div class="main">
<div class="row g-3 mb-4"><div class="col-md-3"><div class="card p-4"><small class="text-muted">Références</small><h2 id="tRef">0</h2></div></div><div class="col-md-3"><div class="card p-4"><small class="text-muted">Qté totale</small><h2 id="tQte">0</h2></div></div><div class="col-md-3"><div class="card p-4"><small class="text-muted">Valeur achat</small><h2 id="tAchat">0</h2></div></div><div class="col-md-3"><div class="card p-4" style="background:var(--primary);color:white"><small style="color:var(--accent)">Valeur vente</small><h2 id="tVente">0</h2><small id="tBen" style="color:var(--accent)">Bénéf: 0</small></div></div></div>
<div id="alertG" class="alert rounded-4" style="display:none;background:var(--accent);color:#000;font-weight:600"></div>
<div class="row g-3 mb-4"><div class="col-md-5"><div class="card p-4"><h6 class="fw-bold">📊 Répartition par catégorie</h6><canvas id="pie"></canvas></div></div><div class="col-md-7"><div class="card p-4"><h6 class="fw-bold">⚠️ Alertes stock ≤5</h6><canvas id="bar"></canvas></div></div></div>

<!-- LISTE PRODUITS - IL MANQUAIT CA -->

</div>
</div>

<script>
let boutique=localStorage.getItem('boutique')||'Boutique Bibi Shop';document.getElementById('bName').innerText=boutique;let stock=[],pieChart,barChart;

async function loadAll(){
 let r=await fetch('/api/stock?boutique='+encodeURIComponent(boutique));
 let j=await r.json();
 stock=j.stock;
 let ach=stock.reduce((a,b)=>a+b.qte*b.achat,0);
 let ven=stock.reduce((a,b)=>a+b.qte*b.vente,0);
 document.getElementById('tRef').innerText=stock.length;
 document.getElementById('tQte').innerText=stock.reduce((a,b)=>a+Number(b.qte),0);
 document.getElementById('tAchat').innerText=ach.toLocaleString()+' FCFA';
 document.getElementById('tVente').innerText=ven.toLocaleString()+' FCFA';
 document.getElementById('tBen').innerText='Bénéf potentiel: '+(ven-ach).toLocaleString()+' FCFA';
 let f=stock.filter(s=>s.qte<=5);
 document.getElementById('alertG').style.display=f.length?'block':'none';
 if(f.length) document.getElementById('alertG').innerText=`⚠️ ${f.length} produits en alerte stock bas: ${f.map(x=>x.nom).join(', ')}`;
 let byCat={};stock.forEach(s=>byCat[s.groupe]=(byCat[s.groupe]||0)+Number(s.qte));
 if(pieChart)pieChart.destroy();
 pieChart=new Chart(document.getElementById('pie'),{type:'doughnut',data:{labels:Object.keys(byCat),datasets:[{data:Object.values(byCat),backgroundColor:['#1e293b','#f59e0b','#10b981','#ef4444','#8b5cf6']}]},options:{plugins:{legend:{position:'bottom'}}}});
 let top=[...stock].sort((a,b)=>a.qte-b.qte).slice(0,6);
 if(barChart)barChart.destroy();
 barChart=new Chart(document.getElementById('bar'),{type:'bar',data:{labels:top.map(s=>s.nom),datasets:[{data:top.map(s=>s.qte),backgroundColor:'#f59e0b',borderRadius:8}]},options:{plugins:{legend:{display:false}},scales:{y:{beginAtZero:true}}}});
 
 let h='';
 stock.forEach(p=>{
  h+=`<div class="d-flex justify-content-between align-items-center border-bottom py-3 flex-wrap gap-2">
  <div><b>${p.nom}</b> <span class="badge rounded-pill" style="background:#f1f5f9;color:#1e293b">${p.groupe}</span><br><small class="text-muted">${p.qte} ${p.unite} • Achat ${p.achat} • Vente ${p.vente} • Bénéf ${p.vente-p.achat} FCFA/u</small></div>
  <div class="d-flex gap-2">
    <button class="btn btn-sm rounded-pill px-3" style="background:#1e293b;color:#fff" onclick="mouv(${p.id},'${p.nom.replace(/'/g,"\\'")}', 'Vendu')"><i class="bi bi-cart-dash"></i> Vendre</button>
    <button class="btn btn-sm btn-gold px-3" onclick="mouv(${p.id},'${p.nom.replace(/'/g,"\\'")}', 'Rechargé')"><i class="bi bi-plus"></i> Stock</button>
    <a href="/enregistrer?id=${p.id}" class="btn btn-sm btn-light rounded-pill">Modifier</a>
    <button class="btn btn-sm btn-light text-danger rounded-pill" onclick="delP(${p.id})"><i class="bi bi-trash"></i></button>
  </div></div>`;
 });
 document.getElementById('list').innerHTML=h||'<p class="text-muted p-3">Aucun produit. Va dans Enregistrer pour ajouter.</p>';
}

async function delP(id){if(!confirm('Supprimer ce produit?'))return;await fetch('/api/stock/'+id,{method:'DELETE'});loadAll();}

// FONCTION VENTE / RECHARGE CORRIGEE
async function mouv(id,nom,type){
 let q=prompt(`${type} - Quantité pour ${nom} ?`, '1');
 if(!q) return;
 q=parseFloat(q);
 if(q<=0){alert('Quantité invalide');return;}
 
 // verif stock si vente
 let prod = stock.find(s=>s.id==id);
 if(type=='Vendu' && prod.qte < q){ alert(`Stock insuffisant! Il reste ${prod.qte} ${prod.unite}`); return; }

 let res = await fetch('/api/mouvement',{
   method:'POST',
   headers:{'Content-Type':'application/json'},
   body:JSON.stringify({id,boutique,produit:nom,type,qte:q})
 });
 let j=await res.json();
 if(j.ok){
   // petit toast
   let msg = type=='Vendu' ? `✅ Vendu ${q} x ${nom} = ${(q*prod.vente).toLocaleString()} FCFA de recette` : `✅ Rechargé ${q} x ${nom}`;
   alert(msg);
   loadAll();
 } else {
   alert('Erreur');
 }
}
loadAll();
</script></body></html>
