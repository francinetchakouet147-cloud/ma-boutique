<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Connexion</title>
<link rel="manifest" href="/static/manifest.json">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background:#f0f2f5;display:flex;align-items:center;justify-content:center;min-height:100vh">
<div class="card p-4 shadow" style="width:100%;max-width:420px;border-radius:15px">
<h4 class="text-center mb-3">Boutique Aurélie</h4>
<div class="mb-3"><label>Nom d'utilisateur</label><input id="nom" class="form-control" placeholder="aurelie ou bibi"></div>
<div class="mb-3"><label>Mot de passe</label><input id="pass" type="password" class="form-control"></div>
<button class="btn btn-primary w-100" onclick="connecter()">Se connecter</button>
<div id="msg" class="mt-3"></div>
</div>
<script>
async function connecter(){
 let nom=document.getElementById('nom').value.trim().toLowerCase();
 let pass=document.getElementById('pass').value.trim();
 if(!nom||!pass) return alert('Remplis tout');
 let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nom,pass})});
 let res=await r.json();
 if(!res.ok){ document.getElementById('msg').innerHTML=`<div class="alert alert-danger">${res.msg}</div>`; return; }
 if(res.role==='admin'){ localStorage.setItem('session','admin'); location.href='/admin'; return; }
 // CLIENT
 if(res.premiere){
   let n1=prompt("PREMIÈRE CONNEXION\nCrée ton nouveau mot de passe:");
   if(!n1||n1.length<4) return alert('4 min');
   let n2=prompt("Confirme:");
   if(n1!==n2) return alert('pas pareil');
   await fetch(`/api/clients/${res.client.id}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({newpass:n1})});
   alert('✅ Mot de passe changé dans stock.db ! Reconnecte-toi avec '+n1); location.reload(); return;
 }
 localStorage.setItem('client',JSON.stringify(res.client));
 localStorage.setItem('boutique',res.client.boutique);
 location.href='/boutique';
}
</script></body></html>
