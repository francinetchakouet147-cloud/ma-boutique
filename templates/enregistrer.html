<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Enregistrer</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
<style>:root{--primary:#1e293b;--accent:#f59e0b;--bg:#f8fafc}body{background:var(--bg)}
.sidebar{width:260px;background:var(--primary);position:fixed;height:100vh;padding:22px;top:0;left:0;color:#cbd5e1;z-index:1000;transition:0.3s}
.sidebar a{color:#94a3b8;text-decoration:none;display:block;padding:12px 14px;border-radius:12px;margin-bottom:8px}.sidebar a.active,.sidebar a:hover{background:#334155;color:#fff}
.main{margin-left:260px;padding:20px 28px}.card{border:0;border-radius:18px;box-shadow:0 4px 20px rgba(0,0,0,.06)}
.hamburger{position:fixed;top:15px;left:15px;z-index:1100;background:var(--primary);color:white;border:0;border-radius:12px;padding:10px 14px;display:none}
.overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:999}
@media(max-width:768px){.sidebar{transform:translateX(-100%)}.sidebar.open{transform:translateX(0)}.main{margin-left:0;padding-top:70px}.hamburger{display:block}.overlay.open{display:block}}
</style></head><body>
<button class="hamburger" onclick="toggleMenu()"><i class="bi bi-list fs-4"></i></button><div class="overlay" id="overlay" onclick="toggleMenu()"></div>
<div class="sidebar" id="sidebar"><h5 class="text-white fw-bold" id="bName">Boutique</h5><small style="color:var(--accent)">Atlas • Enregistrer</small><hr style="border-color:#334155">
<a href="/boutique"><i class="bi bi-grid-fill me-2"></i>Boutique</a><a href="/ventes"><i class="bi bi-cart-check-fill me-2"></i>Ventes</a><a href="/enregistrer" class="active" style="background:var(--accent);color:#000;font-weight:700"><i class="bi bi-plus-circle me-2"></i>Enregistrer</a><a href="/categories"><i class="bi bi-tags me-2"></i>Catégories</a><a href="/historique"><i class="bi bi-clock-history me-2"></i>Historique</a><a href="/" style="background:#0f172a;color:#fff;padding:12px;border-radius:12px;display:block;text-align:center;margin-top:20px">Déconnexion</a></div>

<div class="main"><h5 class="fw-bold">Enregistrer produit - Nouvelle logique</h5>
<div class="card p-4 mt-3">
<div class="row g-3">
<div class="col-md-6"><label class="small text-muted">Nom produit *</label><input id="nom" class="form-control rounded-pill" placeholder="Top Ananas grande"></div>
<div class="col-md-6"><label class="small text-muted">Catégorie / Groupe</label><input id="groupe" class="form-control rounded-pill" placeholder="Jus / Quincaillerie / Bière"></div>

<div class="col-md-4"><label class="small text-muted">Unité de base (tu vends en ?) *</label>
<select id="unite_base" class="form-select rounded-pill">
<option value="bouteille">Bouteille</option>
<option value="pièce">Pièce</option>
<option value="mètre">Mètre</option>
<option value="sac">Sac</option>
<option value="kg">Kg</option>
</select></div>

<div class="col-md-4"><label class="small text-muted">Emballage d'achat</label>
<select id="emb_nom" class="form-select rounded-pill">
<option value="Bouteille / Pièce">Bouteille / Pièce (1)</option>
<option value="Casier 6">Casier 6</option>
<option value="Casier 12">Casier 12</option>
<option value="Casier 14">Casier 14</option>
<option value="Casier 15">Casier 15</option>
<option value="Casier 24">Casier 24</option>
<option value="Casier 25">Casier 25</option>
<option value="Palette 6">Palette 6</option>
<option value="Palette 40">Palette 40</option>
<option value="Palette 72">Palette 72</option>
<option value="Carton 10">Carton 10</option>
<option value="Carton 100">Carton 100</option>
<option value="Rouleau 100m">Rouleau 100m</option>
</select></div>

<div class="col-md-4"><label class="small text-muted">Combien dedans ? (Facteur) *</label><input id="facteur" type="number" class="form-control rounded-pill" value="1" placeholder="Ex: 40 pour palette 40"></div>

<div class="col-md-4"><label class="small text-muted">Qté achetée (en emballage)</label><input id="qte_emb" type="number" class="form-control rounded-pill" value="1" min="1"></div>
<div class="col-md-4"><label class="small text-muted">Prix d'achat d'UN emballage</label><input id="achat_emb" type="number" class="form-control rounded-pill" placeholder="20000"></div>
<div class="col-md-4"><label class="small text-muted">Prix de vente d'UNE bouteille/pièce</label><input id="vente_base" type="number" class="form-control rounded-pill" placeholder="700"></div>

<div class="col-12"><div class="alert rounded-4 mt-2" style="background:#fef3c7;color:#92400e" id="preview">Aperçu: 1 x Palette 40 = 40 bouteilles</div></div>

<div class="col-12 d-grid"><button class="btn rounded-pill fw-bold" style="background:var(--primary);color:#fff" onclick="saveProd()">Enregistrer dans Atlas</button></div>
</div>
</div></div>

<script>
function toggleMenu(){document.getElementById('sidebar').classList.toggle('open');document.getElementById('overlay').classList.toggle('open');}
let boutique=localStorage.getItem('boutique')||'Boutique Bibi Shop';document.getElementById('bName').innerText=boutique;

const params = new URLSearchParams(window.location.search);
let editId = params.get('id');

function updatePreview(){
  let f = parseFloat(document.getElementById('facteur').value)||1;
  let q = parseFloat(document.getElementById('qte_emb').value)||1;
  let emb = document.getElementById('emb_nom').value;
  let ub = document.getElementById('unite_base').value;
  let total = f*q;
  let achatEmb = parseFloat(document.getElementById('achat_emb').value)||0;
  let achatBase = f>0 ? (achatEmb/f) : 0;
  document.getElementById('preview').innerHTML = `Aperçu: ${q} x ${emb} (x${f}) = <b>${total} ${ub}s</b> en stock | Achat 1 ${ub} = ${achatBase.toLocaleString()} FCFA`;
}
document.querySelectorAll('input,select').forEach(e=>e.addEventListener('input',updatePreview));
document.getElementById('emb_nom').addEventListener('change',()=>{
  let map={"Casier 6":6,"Casier 12":12,"Casier 14":14,"Casier 15":15,"Casier 24":24,"Casier 25":25,"Palette 6":6,"Palette 40":40,"Palette 72":72,"Carton 10":10,"Carton 100":100,"Rouleau 100m":100};
  let v=document.getElementById('emb_nom').value;
  if(map[v]) document.getElementById('facteur').value=map[v];
  updatePreview();
});

async function loadEdit(){
  if(!editId) return;
  let r=await fetch('/api/stock?boutique='+encodeURIComponent(boutique));
  let j=await r.json();
  let p=j.stock.find(x=>x._id==editId);
  if(!p) return;
  document.getElementById('nom').value=p.nom;
  document.getElementById('groupe').value=p.groupe;
  document.getElementById('unite_base').value=p.unite_base||p.unite||'bouteille';
  document.getElementById('vente_base').value=p.vente_base||p.vente||0;
  if(p.emballages && p.emballages[0]) document.getElementById('facteur').value=p.emballages[0].facteur||1;
  document.getElementById('qte_emb').value=1;
  document.getElementById('achat_emb').value=(p.achat_base||p.achat||0)* (parseFloat(document.getElementById('facteur').value)||1);
  updatePreview();
}

async function saveProd(){
  let nom=document.getElementById('nom').value.trim();
  let groupe=document.getElementById('groupe').value.trim()||'Autre';
  let unite_base=document.getElementById('unite_base').value;
  let emb_nom=document.getElementById('emb_nom').value;
  let facteur=parseFloat(document.getElementById('facteur').value)||1;
  let qte_emb=parseFloat(document.getElementById('qte_emb').value)||1;
  let achat_emb=parseFloat(document.getElementById('achat_emb').value)||0;
  let vente_base=parseFloat(document.getElementById('vente_base').value)||0;

  if(!nom||!vente_base){alert('Remplis nom + prix vente');return;}

  let stock_base = qte_emb * facteur;
  let achat_base = facteur>0 ? achat_emb / facteur : 0;

  let emballages = [
    {nom:'Bouteille / Pièce', facteur:1},
    {nom:'Casier 6', facteur:6},
    {nom:'Casier 12', facteur:12},
    {nom:'Casier 14', facteur:14},
    {nom:'Casier 15', facteur:15},
    {nom:'Casier 24', facteur:24},
    {nom:'Casier 25', facteur:25},
    {nom:'Palette 40', facteur:40},
    {nom:'Palette 72', facteur:72},
    {nom:'Carton 100', facteur:100},
  ];
  // Ajoute l'emballage custom s'il n'existe pas
  if(!emballages.find(e=>e.facteur==facteur && e.nom==emb_nom)){
    emballages.push({nom:emb_nom, facteur:facteur});
  }

  let payload = {
    id: editId||'',
    boutique, nom, groupe,
    unite_base, stock_base, achat_base, vente_base, emballages,
    qte: stock_base, unite: unite_base, achat: achat_base, vente: vente_base
  };

  let res=await fetch('/api/stock',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
  let j=await res.json();
  if(j.ok){alert(`✅ ${nom} enregistré: ${stock_base} ${unite_base}s`); window.location.href='/boutique';}
  else alert('Erreur');
}
loadEdit();updatePreview();
</script></body></html>
