<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Enregistrer</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
<style>:root{--primary:#1e293b;--accent:#f59e0b;--bg:#f8fafc}body{background:var(--bg)}
.sidebar{width:260px;background:var(--primary);position:fixed;height:100vh;padding:22px;color:#cbd5e1;z-index:1000;transition:0.3s;overflow-y:auto}
.sidebar a{color:#94a3b8;text-decoration:none;display:block;padding:12px 14px;border-radius:12px;margin-bottom:8px}.sidebar a.active,.sidebar a:hover{background:#334155;color:#fff}
.main{margin-left:260px;padding:28px}.card{border:0;border-radius:20px;box-shadow:0 8px 30px rgba(0,0,0,.06)}.input{border-radius:14px;padding:13px;border:1px solid #e2e8f0}.btn-gold{background:var(--accent);border:0;color:#000;font-weight:800;border-radius:12px;padding:13px}
.hamburger{position:fixed;top:15px;left:15px;z-index:1100;background:var(--primary);color:white;border:0;border-radius:12px;padding:10px 14px;display:none}
.overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:999}
@media(max-width:768px){.sidebar{transform:translateX(-100%)}.sidebar.open{transform:translateX(0)}.main{margin-left:0;padding-top:70px}.hamburger{display:block}.overlay.open{display:block}}
</style></head><body>
<button class="hamburger" onclick="toggleMenu()"><i class="bi bi-list fs-4"></i></button><div class="overlay" id="overlay" onclick="toggleMenu()"></div>
<div class="sidebar" id="sidebar"><h5 class="text-white fw-bold" id="bName">Boutique</h5><small style="color:var(--accent)">Atlas</small><hr style="border-color:#334155">
<a href="/boutique"><i class="bi bi-grid-fill me-2"></i>Boutique</a><a href="/enregistrer" class="active"><i class="bi bi-plus-circle me-2"></i>Enregistrer</a><a href="/categories"><i class="bi bi-tags me-2"></i>Catégories</a><a href="/ventes"><i class="bi bi-cart-check-fill me-2"></i>Ventes</a><a href="/historique"><i class="bi bi-clock-history me-2"></i>Historique</a><a href="/depenses"><i class="bi bi-cash-stack me-2"></i>Dépenses</a><div style="margin-top:20px"><a href="/" style="background:#0f172a;color:#fff;padding:12px;border-radius:12px;display:block;text-align:center">Déconnexion</a></div></div>
<div class="main"><div class="card p-4 p-md-5 mb-4"><div class="d-flex align-items-center gap-3 mb-4"><div style="width:48px;height:48px;background:var(--primary);color:var(--accent);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px">+</div><div><h4 class="fw-bold mb-0" id="title">Nouveau produit</h4><small class="text-muted">Atlas • ma-boutique</small></div></div>
<div class="row g-3"><div class="col-md-6"><label class="fw-semibold">Nom du produit *</label><input id="p_nom" class="form-control input" placeholder="Ex: Jus 1L"></div><div class="col-md-6"><label class="fw-semibold">Catégorie *</label><input id="p_groupe" class="form-control input" placeholder="Ex: Boissons" list="catList"><datalist id="catList"></datalist></div><div class="col-md-3"><label class="fw-semibold">Quantité *</label><input id="p_qte" type="number" class="form-control input"></div><div class="col-md-3"><label class="fw-semibold">Unité</label><input id="p_unite" class="form-control input" placeholder="bouteille"></div><div class="col-md-3"><label class="fw-semibold">Prix d'achat</label><input id="p_achat" type="number" class="form-control input"></div><div class="col-md-3"><label class="fw-semibold">Prix de vente</label><input id="p_vente" type="number" class="form-control input"></div></div><input type="hidden" id="p_id"><button class="btn btn-gold w-100 mt-4" onclick="save()">💾 Enregistrer dans Atlas</button><div id="msg" class="mt-3"></div></div><div class="card p-4"><div class="d-flex justify-content-between mb-4 flex-wrap gap-2"><h5 class="fw-bold">📦 Mes produits (<span id="count">0</span>)</h5><input id="search" class="form-control" style="max-width:320px;border-radius:50px" placeholder="🔍 Rechercher..." oninput="render()"></div><div class="table-responsive"><table class="table align-middle"><thead><tr><th>Produit</th><th>Catégorie</th><th>Stock</th><th>Achat</th><th>Vente</th><th>Bénéf</th><th class="text-end">Actions</th></tr></thead><tbody id="list"></tbody></table></div></div></div>
<script>
function toggleMenu(){document.getElementById('sidebar').classList.toggle('open');document.getElementById('overlay').classList.toggle('open');}
let boutique=localStorage.getItem('boutique')||'Boutique Bibi Shop';document.getElementById('bName').innerText=boutique;let stock=[];let params=new URLSearchParams(location.search);let editId=params.get('id');
async function loadAll(){let r=await fetch('/api/stock?boutique='+encodeURIComponent(boutique));let j=await r.json();stock=j.stock;document.getElementById('count').innerText=stock.length;let cats=[...new Set(stock.map(s=>s.groupe))];document.getElementById('catList').innerHTML=cats.map(c=>`<option value="${c}">`).join('');if(editId){let p=stock.find(x=>x._id==editId);if(p){document.getElementById('p_id').value=p._id;document.getElementById('p_nom').value=p.nom;document.getElementById('p_groupe').value=p.groupe;document.getElementById('p_qte').value=p.qte;document.getElementById('p_unite').value=p.unite;document.getElementById('p_achat').value=p.achat;document.getElementById('p_vente').value=p.vente;document.getElementById('title').innerText='✏️ Modifier '+p.nom;}}render();}
function render(){let q=document.getElementById('search').value.toLowerCase();let f=stock.filter(p=>p.nom.toLowerCase().includes(q)||p.groupe.toLowerCase().includes(q));let h='';f.forEach(p=>{let benef=p.vente-p.achat;h+=`<tr><td><b>${p.nom}</b></td><td><span class="badge rounded-pill" style="background:#f1f5f9;color:#1e293b">${p.groupe}</span></td><td>${p.qte} ${p.unite}</td><td>${p.achat.toLocaleString()}</td><td class="fw-bold">${p.vente.toLocaleString()}</td><td style="color:#10b981;font-weight:700">+${benef.toLocaleString()}</td><td class="text-end"><button class="btn btn-sm btn-light rounded-pill" onclick="edit('${p._id}')">✏️</button><button class="btn btn-sm btn-outline-danger rounded-pill" onclick="delP('${p._id}')"><i class="bi bi-trash"></i></button></td></tr>`});document.getElementById('list').innerHTML=h||'<tr><td colspan=7 class="text-center text-muted">Aucun produit</td></tr>';}
function edit(id){let p=stock.find(x=>x._id==id);document.getElementById('p_id').value=p._id;document.getElementById('p_nom').value=p.nom;document.getElementById('p_groupe').value=p.groupe;document.getElementById('p_qte').value=p.qte;document.getElementById('p_unite').value=p.unite;document.getElementById('p_achat').value=p.achat;document.getElementById('p_vente').value=p.vente;document.getElementById('title').innerText='✏️ Modifier '+p.nom;window.scrollTo({top:0,behavior:'smooth'});}
async function delP(id){if(!confirm('Supprimer?'))return;await fetch('/api/stock/'+id,{method:'DELETE'});loadAll();}
async function save(){let data={id:document.getElementById('p_id').value||null,boutique,groupe:document.getElementById('p_groupe').value.trim(),nom:document.getElementById('p_nom').value.trim(),qte:parseFloat(document.getElementById('p_qte').value)||0,unite:document.getElementById('p_unite').value||'pièce',achat:parseFloat(document.getElementById('p_achat').value)||0,vente:parseFloat(document.getElementById('p_vente').value)||0};if(!data.nom||!data.groupe)return alert('Nom et catégorie obligatoires');await fetch('/api/stock',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});document.getElementById('msg').innerHTML='<div class="alert alert-success py-2">✅ Enregistré dans Atlas</div>';document.getElementById('p_id').value='';document.getElementById('p_nom').value='';loadAll();}
loadAll();
</script></body></html>
